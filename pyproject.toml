[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carapace"
version = "1.0.0"
description = "Carapace DSL for turtle graphics"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
carapace = "main:main"

[tool.setuptools]
packages = ["src"]
py-modules = ["main"]

[tool.setuptools.package-data]
src = ["grammar.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

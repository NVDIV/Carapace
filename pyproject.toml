[project]
name = "carapace"
version = "0.1.0"
description = "Carapace DSL for turtle graphics"
requires-python = ">=3.10"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
